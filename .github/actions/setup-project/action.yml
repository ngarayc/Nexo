name: Preparar fuentes Nexo
description: Node y npm fijados con instalación mediante lockfile, sin herramientas globales.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
        package-manager-cache: false
    - shell: bash
      run: |
        npm install --prefix "$RUNNER_TEMP/nexo-npm" --no-save --package-lock=false --ignore-scripts --no-audit npm@12.2.0
        printf '%s\n' "$RUNNER_TEMP/nexo-npm/node_modules/.bin" >> "$GITHUB_PATH"
    - shell: bash
      run: npm ci --no-audit
