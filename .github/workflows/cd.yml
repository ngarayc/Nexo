name: CD Azure
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: nexo-azure-main
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.repository == 'ngarayc/Nexo' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.proof.outputs.deploy }}
      sha: ${{ steps.proof.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: proof
        run: node scripts/cd/verify.mjs
  deploy:
    needs: verify
    if: ${{ needs.verify.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    environment:
      name: azure-demo
      url: ${{ vars.NEXO_PUBLIC_ORIGIN }}
    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_CORE_OUTPUT: none
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
      NEXO_PUBLIC_ORIGIN: ${{ vars.NEXO_PUBLIC_ORIGIN }}
      NEXO_REQUIRE_CURRENT: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verificar main y evidencia de CI
        id: proof
        run: node scripts/cd/verify.mjs
      - name: Autenticar en Azure mediante OIDC
        if: ${{ steps.proof.outputs.deploy == 'true' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Desplegar Docker y comprobar HTTPS
        if: ${{ steps.proof.outputs.deploy == 'true' }}
        run: node scripts/cd/deploy.mjs
