<main aria-labelledby="page-title">
  <p class="eyebrow">TELEMETRÍA DE FLOTAS</p>
  <h1 id="page-title">Nexo</h1>
  <p>Inicia sesión para acceder al panel.</p>
  @if (access.notice()) {
  <p role="status">{{ access.notice() }}</p>
  }
  <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="access.pending()">
    <label for="username">Usuario</label>
    <input id="username" type="text" autocomplete="username" formControlName="username" required />
    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      formControlName="password"
      required
    />
    <button type="submit" [disabled]="form.invalid || access.pending()">
      {{ access.pending() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
  @if (access.error()) {
  <p role="alert">{{ access.error() }}</p>
  }
  <p class="demo-hint">
    Demo local: usuario <strong>demo</strong> y contraseña <strong>demo</strong>.
  </p>
</main>
