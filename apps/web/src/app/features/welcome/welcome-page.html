<main aria-labelledby="page-title">
  <div class="identity" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="eyebrow">TELEMETRÍA DE FLOTAS</p>
  <h1 id="page-title">Nexo</h1>
  <p class="description">Vehículos, información y supervisión conectados.</p>
  @if (access.session(); as session) {
  <p>Sesión iniciada como {{ session.user.username }}.</p>
  <button type="button" (click)="access.logout()" [disabled]="access.pending()">
    Cerrar sesión
  </button>
  @if (access.error()) {
  <p role="alert">{{ access.error() }}</p>
  } }
</main>
