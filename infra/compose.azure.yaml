name: nexo-cloud

x-cloud-runtime: &cloud-runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    <<: *cloud-runtime
    mem_limit: 768m
  api:
    <<: *cloud-runtime
    mem_limit: 768m
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Falta el origen HTTPS}
      DEMO_USERNAME: ${DEMO_USERNAME:?Falta el usuario privado}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Falta la contraseña privada}
  web:
    <<: *cloud-runtime
    mem_limit: 192m
    ports: !reset []
    volumes:
      - ${NEXO_PROXY_CONFIG:?Falta el proxy HTTPS generado}:/etc/nginx/nginx.conf:ro
  gateway:
    <<: *cloud-runtime
    image: nexo-gateway:local
    build:
      context: ..
      dockerfile: infra/gateway.Dockerfile
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=32m,mode=1777']
    mem_limit: 256m
    ports: ['80:80', '443:443']
    environment:
      NEXO_DOMAIN: ${NEXO_DOMAIN:?Falta el dominio}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${NEXO_DATA_PATH:?Falta el disco de persistencia}/caddy-data:/data
      - ${NEXO_DATA_PATH:?Falta el disco de persistencia}/caddy-config:/config
    networks: [application]
    depends_on:
      web:
        condition: service_started

volumes:
  postgres18-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NEXO_DATA_PATH:?Falta el disco de persistencia}/postgres
    labels:
      io.github.ngarayc.nexo.purpose: azure-demo
