name: nexo
services:
  db:
    image: nexo-db:local
    build:
      context: ..
      dockerfile: infra/db.Dockerfile
    environment:
      POSTGRES_DB: ${DB_NAME:?Falta DB_NAME}
      POSTGRES_USER: nexo_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Falta DB_OWNER_PASSWORD}
      NEXO_APP_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres18-data:/var/lib/postgresql
      - ./db-init.sh:/docker-entrypoint-initdb.d/01-nexo.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nexo_owner -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [database]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
  api:
    image: nexo-api:local
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      DB_HOST: ${DB_HOST:?Falta DB_HOST}
      DB_NAME: ${DB_NAME:?Falta DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Falta DB_OWNER_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Falta SESSION_SECRET}
      INGEST_API_KEY: ${INGEST_API_KEY:?Falta INGEST_API_KEY}
      DEMO_ENABLED: ${DEMO_ENABLED:?Falta DEMO_ENABLED}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "const r = await fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(4000)}); if(!r.ok) process.exit(1)"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [application, database]
    stop_grace_period: 15s
  web:
    image: nexo-web:local
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    ports: ['127.0.0.1:${WEB_PORT:-8080}:8080']
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [CMD-SHELL, 'curl --fail --silent --max-time 4 http://127.0.0.1:8080/api/health >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [application]
    stop_grace_period: 15s
volumes:
  postgres18-data:
networks:
  application:
  database:
    internal: true
