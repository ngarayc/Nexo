worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 2m;
  client_body_timeout 15s;
  send_timeout 15s;
  server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 421; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    error_page 413 = @body_too_large;
    location @body_too_large {
      internal;
      default_type application/problem+json;
      add_header Cache-Control no-store always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
      return 413 '{"type":"about:blank","title":"Contenido demasiado grande","status":413,"detail":"El cuerpo supera el máximo admitido.","code":"BODY_TOO_LARGE","requestId":"$request_id","accepted":0,"duplicates":0,"rejected":0,"errors":[],"admission":"not_admitted","resultsAvailable":false}';
    }
    location ~ ^/api(?:/|$) {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Real-IP "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_intercept_errors off;
      proxy_cache off;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }
    location / {
      try_files $uri $uri/ /index.html;
      sub_filter_once off;
      sub_filter 'NEXO_NONCE' '$request_id';
      add_header Cache-Control no-store;
      # Al agregar una cabecera en un location, NGINX no hereda las del servidor.
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
  }
}
